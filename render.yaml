services:
  - type: web
    name: pokedex-api
    runtime: node
    plan: free
    rootDir: pokedex-manager
    buildCommand: npm install && npm run build -w @pokedex/shared && npm run db:generate -w @pokedex/api && npm run build -w @pokedex/api
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pokedex-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /health

  - type: web
    name: pokedex-web
    runtime: static
    plan: free
    rootDir: pokedex-manager
    buildCommand: npm install && npm run build -w @pokedex/shared && npm run build -w @pokedex/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: pokedex-db
    plan: free
